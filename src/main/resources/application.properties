spring.application.name=presence-server

# ── CONFIGURATION SUPABASE (Variables pour Render) ──────────────────────────
# URL de connexion basée sur ton lien Supabase eu-west-1
spring.datasource.url=jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require

# Liaison dynamique avec tes variables d'environnement Render
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Optimisations du Pool HikariCP indispensables pour la réactivité de Supabase
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
# ─────────────────────────────────────────────────────────────────────────────

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.address=0.0.0.0
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:MaCleSecreteParDefautTresLongueDePlusDe32Caracteres}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# ── Email ────────────────────────────────────────────────────────────────────
# Configuration SMTP Brevo (Remplaçant de Gmail)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=ac7331001@smtp-brevo.com
spring.mail.password=${PASSWORD}

# Propriétés de sécurité
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
